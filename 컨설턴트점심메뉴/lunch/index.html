<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 팀 공유용 링크다. 검색에 잡힐 이유가 없다. -->
<meta name="robots" content="noindex, nofollow">
<title>우리 팀 점심 기록</title>
<style>
  :root {
    color-scheme: light;
    --page: #f8fafc;
    --surface: #ffffff;
    --ink: #0f172a;
    --ink-2: #475569;
    --ink-3: #94a3b8;
    --hairline: #e2e8f0;
    --accent-from: #f97316;
    --accent-to: #f43f5e;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.05);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 0 64px;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }

  /* ── 헤더 ── */
  header { padding: 40px 0 28px; }
  h1 {
    margin: 0;
    font-size: clamp(1.6rem, 1.1rem + 1.8vw, 2.4rem);
    letter-spacing: -.02em;
    background: linear-gradient(95deg, var(--accent-from), var(--accent-to));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: inline-block;
  }
  .sub { margin: 6px 0 0; color: var(--ink-2); font-size: .95rem; }

  /* ── KPI ── */
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 30px 0 8px; }
  .kpi {
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow);
  }
  .kpi .label { font-size: .8rem; color: var(--ink-2); }
  /* 누를 수 있는 KPI — 나머지 카드와 같아 보이되 커서와 힌트로 구분한다 */
  .kpi-btn {
    appearance: none; cursor: pointer; text-align: left; font: inherit; color: inherit;
    display: block; width: 100%;
  }
  .kpi-btn:hover { border-color: var(--accent-from); }
  .kpi-btn:focus-visible { outline: 2px solid var(--accent-from); outline-offset: 2px; }
  .kpi-btn .more { color: var(--accent-to); font-weight: 600; margin-left: 4px; }
  .kpi .value { font-size: 1.9rem; font-weight: 650; letter-spacing: -.02em; }
  .kpi .value small { font-size: .9rem; font-weight: 500; color: var(--ink-3); margin-left: 2px; }

  /* ── 섹션 ── */
  section { margin-top: 30px; }
  .card {
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px;
  }
  h2 { font-size: 1.05rem; margin: 0; letter-spacing: -.01em; }
  .bar-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
  }

  /* ── 토글 / 버튼 ── */
  .seg { display: inline-flex; background: var(--page); border: 1px solid var(--hairline); border-radius: 999px; padding: 3px; }
  .seg button {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    font: inherit; font-size: .88rem; color: var(--ink-2);
    padding: 6px 15px; border-radius: 999px; transition: background .15s, color .15s;
  }
  .seg button[aria-pressed="true"] {
    background: linear-gradient(95deg, var(--accent-from), var(--accent-to));
    color: #fff; font-weight: 600;
  }
  .nav { display: inline-flex; align-items: center; gap: 4px; }
  .nav button, .ghost {
    appearance: none; cursor: pointer; font: inherit; font-size: .88rem;
    background: var(--surface); color: var(--ink-2);
    border: 1px solid var(--hairline); border-radius: 9px;
    min-width: 34px; height: 34px; padding: 0 12px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .nav button:hover, .ghost:hover { background: var(--page); color: var(--ink); }
  .nav .range { font-size: .92rem; font-weight: 600; color: var(--ink); padding: 0 8px; white-space: nowrap; }

  /* ── 주간 ── */
  /* 오늘과 가까운 순으로 위에서부터 쌓는 목록. 가로 카드가 세로 목록에 더 맞다. */
  .week { display: flex; flex-direction: column; gap: 10px; }
  .day {
    overflow: hidden; display: flex; align-items: stretch;
    border: 1px solid var(--hairline); border-radius: var(--radius);
    background: var(--surface); min-height: 96px;
  }
  .day .head {
    width: 92px; flex: none; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
    border-right: 1px solid var(--hairline); background: var(--page);
  }
  .day .dow { font-weight: 700; font-size: 1.05rem; }
  .day .dnum { font-size: .78rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .day.today .head { background: linear-gradient(160deg, var(--accent-from), var(--accent-to)); border-right-color: transparent; }
  .day.today .dow { color: #fff; }
  .day.today .dnum { color: rgba(255,255,255,.85); }
  .day .body { flex: 1; display: flex; align-items: center; gap: 14px; padding: 10px 14px; min-width: 0; }
  .day .shotimg {
    width: 148px; height: 76px; flex: none; border-radius: 10px;
    background-size: cover; background-position: center; background-color: var(--page);
  }
  .day .meta { min-width: 0; }
  .day .rest { font-weight: 650; font-size: 1.02rem; letter-spacing: -.01em; }
  .day .menu { font-size: .86rem; color: var(--ink-2); margin-top: 2px; }
  .day .empty { flex: 1; display: flex; align-items: center; padding: 0 14px; color: var(--ink-3); font-size: .84rem; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: .72rem; font-weight: 600; color: var(--ink-2);
    background: var(--page); border: 1px solid var(--hairline);
    border-radius: 999px; padding: 2px 9px 2px 7px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  /* ── 월간 ── */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal .dowhead { text-align: center; font-size: .78rem; color: var(--ink-2); font-weight: 600; padding-bottom: 4px; }
  .cal .dowhead.wknd { color: var(--ink-3); }
  .cell {
    min-height: 92px; border: 1px solid var(--hairline); border-radius: 10px;
    padding: 6px; background: var(--surface); overflow: hidden;
    display: flex; flex-direction: column; gap: 4px;
  }
  .cell.blank { border: 0; background: transparent; }
  .cell.wknd { background: #fbfcfd; }
  .cell .n { font-size: .74rem; color: var(--ink-3); font-variant-numeric: tabular-nums; flex: none; }
  .cell.today .n { color: #fff; background: linear-gradient(95deg, var(--accent-from), var(--accent-to));
    width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; }
  /* 좁은 칸에서 식당명이 한 글자씩 세로로 쪼개지지 않게. flex 자식은 min-width가
     auto라 min-width:0을 주지 않으면 줄바꿈으로 버틴다. */
  .cell .mini {
    display: flex; align-items: center; gap: 4px; flex: none; min-width: 0;
    font-size: .74rem; font-weight: 600; line-height: 1.3;
  }
  .cell .mini span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 높이를 고정한다. flex:1로 두면 사진 있는 칸만 길어져 달력 줄이 들쭉날쭉해진다. */
  .cell .thumb { width: 100%; flex: none; height: 40px; border-radius: 6px; background-size: cover; background-position: center; background-color: var(--page); }

  /* ── 차트 ── */
  .stack { display: flex; gap: 2px; height: 24px; margin: 4px 0 14px; }
  .stack > div { min-width: 3px; border-radius: 0; }
  .stack > div:first-child { border-radius: 4px 0 0 4px; }
  .stack > div:last-child { border-radius: 0 4px 4px 0; }
  .stack > div:only-child { border-radius: 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 20px; }
  .legend .item { display: flex; align-items: center; gap: 7px; font-size: .86rem; }
  .legend .nm { color: var(--ink); font-weight: 600; }
  .legend .vl { color: var(--ink-2); font-variant-numeric: tabular-nums; }

  .rank { display: flex; flex-direction: column; gap: 9px; }
  .rank .row { display: grid; grid-template-columns: minmax(94px, 148px) 1fr auto; align-items: center; gap: 10px; }
  .rank .nm { font-size: .87rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank .track { height: 16px; }
  .rank .fill { height: 16px; border-radius: 0 4px 4px 0; min-width: 3px; }
  .rank .vl { font-size: .82rem; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rank .last { color: var(--ink-3); font-weight: 400; }

  /* ── 추천 ── */
  .reco { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .reco .pick { font-size: 1.65rem; font-weight: 700; letter-spacing: -.02em; }
  .reco .why { color: var(--ink-2); font-size: .88rem; }
  .reco .cta {
    appearance: none; cursor: pointer; font: inherit; font-size: .88rem; font-weight: 600;
    color: #fff; border: 0; border-radius: 10px; padding: 10px 18px;
    background: linear-gradient(95deg, var(--accent-from), var(--accent-to));
  }
  .reco .cta:hover { filter: brightness(1.05); }

  /* ── 표 ── */
  details.table { margin-top: 30px; }
  details.table > summary {
    cursor: pointer; font-size: .9rem; font-weight: 600; color: var(--ink-2);
    padding: 12px 16px; background: var(--surface);
    border: 1px solid var(--hairline); border-radius: var(--radius);
  }
  details.table[open] > summary { border-radius: var(--radius) var(--radius) 0 0; }
  .tbl-scroll { overflow-x: auto; border: 1px solid var(--hairline); border-top: 0; border-radius: 0 0 var(--radius) var(--radius); background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: .86rem; }
  th, td { text-align: left; padding: 9px 14px; border-top: 1px solid var(--hairline); white-space: nowrap; }
  th { color: var(--ink-2); font-weight: 600; }
  td.num, th.num { font-variant-numeric: tabular-nums; }
  td.wide { white-space: normal; min-width: 200px; }

  .hint { color: var(--ink-3); font-size: .82rem; margin: 10px 0 0; }
  footer { color: var(--ink-3); font-size: .8rem; text-align: center; margin-top: 36px; }
  [hidden] { display: none !important; }

  /* ── 상세보기 ── */
  /* 누를 수 있는 요소라는 걸 알려준다. 기록 없는 날은 이 클래스가 안 붙는다. */
  .openable { cursor: pointer; }
  .day .body.openable:hover .rest { text-decoration: underline; text-underline-offset: 3px; }
  .cell .mini.openable:hover span { text-decoration: underline; }
  .openable:focus-visible { outline: 2px solid var(--accent-from); outline-offset: 2px; }

  /* .dlg = 공용 오버레이. 상세보기(#detail)와 식당 목록(#roster)이 같이 쓴다. */
  .dlg {
    position: fixed; inset: 0; z-index: 100; display: none;
    align-items: center; justify-content: center; padding: 24px;
    background: rgba(2, 6, 23, .62);
  }
  .dlg.on { display: flex; }
  .dlg .box {
    position: relative;   /* 닫기 버튼을 화면이 아니라 이 박스 기준으로 붙인다 */
    background: var(--surface); border-radius: 16px; overflow: hidden;
    width: min(680px, 100%); max-height: 90vh;
    display: flex; flex-direction: column;
    box-shadow: 0 24px 60px rgba(2, 6, 23, .4);
  }
  /* 사진 원본이 3MB급이라 화면을 넘지 않게 가둔다. */
  #detail .shot {
    width: 100%; max-height: 54vh; object-fit: contain;
    background: #0f172a; display: block; flex: none;
  }
  #detail .info { padding: 18px 20px 20px; overflow-y: auto; }
  #detail .when { font-size: .84rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  #detail .name { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; margin: 2px 0 8px; }
  #detail .tags { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  #detail .row { display: flex; gap: 10px; font-size: .95rem; padding: 7px 0; border-top: 1px solid var(--hairline); }
  #detail .row .k { color: var(--ink-2); flex: none; min-width: 52px; }
  .dlg .close {
    position: absolute; top: 12px; right: 12px; z-index: 1;
    appearance: none; cursor: pointer; border: 0; border-radius: 999px;
    width: 36px; height: 36px; font-size: 1rem; line-height: 1;
    background: rgba(255, 255, 255, .92); color: #0f172a;
    box-shadow: 0 2px 8px rgba(2, 6, 23, .25);
  }
  .dlg .close:hover { background: #fff; }

  /* 식당 목록 */
  #roster .head2 { padding: 18px 20px 12px; border-bottom: 1px solid var(--hairline); }
  #roster .head2 h3 { margin: 0; font-size: 1.15rem; letter-spacing: -.01em; }
  #roster .head2 p { margin: 4px 0 0; font-size: .84rem; color: var(--ink-2); }
  #roster .list { overflow-y: auto; padding: 6px 0 10px; }
  #roster .item {
    display: grid; grid-template-columns: 1fr auto auto; align-items: center;
    gap: 12px; padding: 10px 20px; border-top: 1px solid var(--hairline);
  }
  #roster .item:first-child { border-top: 0; }
  #roster .rn { display: flex; align-items: center; gap: 8px; font-size: .93rem; font-weight: 600; min-width: 0; }
  #roster .rn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #roster .rc { font-size: .86rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  #roster .rl { font-size: .82rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  @media (max-width: 560px) {
    .dlg { padding: 12px; }
    #detail .name { font-size: 1.25rem; }
    #detail .shot { max-height: 42vh; }
    #roster .item { padding: 10px 14px; gap: 8px; }
  }

  /* ── 툴팁 ── */
  #tip {
    position: fixed; z-index: 50; pointer-events: none; opacity: 0;
    transition: opacity .12s; background: #0f172a; color: #fff;
    font-size: .78rem; line-height: 1.5; padding: 7px 10px; border-radius: 8px;
    box-shadow: 0 6px 20px rgba(2,6,23,.28); max-width: 260px;
  }
  #tip.on { opacity: 1; }
  [data-tip] { cursor: default; }
  [data-tip]:focus-visible { outline: 2px solid var(--accent-from); outline-offset: 2px; }

  /* TV·큰 화면에서 주간 뷰가 멀리서도 읽히게 */
  @media (min-width: 1500px) {
    .wrap { max-width: 1600px; }
    .day { min-height: 132px; }
    .day .head { width: 124px; }
    .day .dow { font-size: 1.5rem; }
    .day .dnum { font-size: 1rem; }
    .day .shotimg { width: 208px; height: 108px; }
    .day .rest { font-size: 1.45rem; }
    .day .menu { font-size: 1.1rem; }
    .reco .pick { font-size: 2.1rem; }
    .kpi .value { font-size: 2.3rem; }
  }
  @media (max-width: 900px) {
    .kpis { grid-template-columns: 1fr; }
  }
  /* 달력 7칸이 좁아지면 사진을 빼고 이름 한 줄만 남긴다 — 칸이 길어지는 걸 막는다. */
  @media (max-width: 720px) {
    .cell { min-height: 58px; padding: 5px; }
    .cell .thumb { display: none; }
    .cell .mini { font-size: .68rem; }
    .cal { gap: 4px; }
  }
  @media (max-width: 560px) {
    .day { min-height: 78px; }
    .day .head { width: 62px; }
    .day .dow { font-size: .95rem; }
    .day .body { gap: 10px; padding: 8px 10px; }
    .day .shotimg { width: 92px; height: 62px; }
    .day .rest { font-size: .95rem; }
    .day .menu { font-size: .8rem; }
    .rank .row { grid-template-columns: minmax(74px, 108px) 1fr auto; }
  }
  @media print { .seg, .nav, .reco .cta, #detail, #tip { display: none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>우리 팀 점심 기록</h1>
    <p class="sub" id="sub"></p>
  </header>

  <!-- 오늘 뭐 먹지 -->
  <section>
    <div class="card">
      <div class="bar-row"><h2>🍽 오늘 뭐 먹지?</h2></div>
      <div class="reco">
        <div style="flex:1 1 260px">
          <div class="pick" id="reco-name">—</div>
          <div class="why" id="reco-why"></div>
        </div>
        <button class="cta" id="reco-again">다른 추천 🎲</button>
      </div>
    </div>
  </section>

  <!-- 주간 / 월간 -->
  <section>
    <div class="bar-row">
      <div class="seg" role="group" aria-label="보기 전환">
        <button id="v-week" aria-pressed="true">주간</button>
        <button id="v-month" aria-pressed="false">월간</button>
      </div>
      <div class="nav">
        <button id="prev" aria-label="이전">‹</button>
        <span class="range" id="range"></span>
        <button id="next" aria-label="다음">›</button>
        <button class="ghost" id="jump">오늘</button>
      </div>
    </div>
    <div id="week-view" class="week"></div>
    <div id="month-view" class="card" hidden><div class="cal" id="cal"></div></div>
  </section>

  <!-- 통계 — 필터 한 줄이 아래 두 차트를 함께 걸러낸다 -->
  <section>
    <div class="bar-row">
      <h2>📊 무엇을 얼마나 먹었나</h2>
      <div class="seg" role="group" aria-label="통계 기간">
        <button id="r-all" aria-pressed="true">전체</button>
        <button id="r-month" aria-pressed="false">이번 달</button>
      </div>
    </div>
    <div class="card" style="margin-bottom:12px">
      <h2 style="font-size:.92rem;color:var(--ink-2);font-weight:600">카테고리 분포</h2>
      <div class="stack" id="stack"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="card">
      <h2 style="font-size:.92rem;color:var(--ink-2);font-weight:600;margin-bottom:12px">자주 간 식당</h2>
      <div class="rank" id="rank"></div>
      <p class="hint" id="rank-hint"></p>
    </div>
  </section>

  <!-- 표 보기 — 모든 값을 색 없이 읽을 수 있는 경로 -->
  <details class="table">
    <summary>전체 기록 표로 보기</summary>
    <div class="tbl-scroll">
      <table>
        <thead><tr>
          <th class="num">날짜</th><th>식당</th><th>지역</th><th>분류</th><th class="wide">메뉴</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </details>

  <!-- 요약 숫자는 본문을 먼저 보여주기 위해 하단으로 내렸다 -->
  <div class="kpis">
    <div class="kpi"><div class="label">기록한 점심</div><div class="value">38<small>번</small></div></div>
    <button class="kpi kpi-btn" id="kpi-restaurants" aria-haspopup="dialog">
      <div class="label">가본 식당 <span class="more">목록 보기 ›</span></div>
      <div class="value">29<small>곳</small></div>
    </button>
    <div class="kpi"><div class="label">두 번 이상 간 식당</div><div class="value">6<small>곳</small></div></div>
  </div>

  <footer>2026-08-10 13:05 기준 · 회사 점심 기록만 표시합니다</footer>
</div>

<div id="detail" class="dlg" role="dialog" aria-modal="true" aria-labelledby="detail-name">
  <div class="box">
    <button class="close" aria-label="닫기">✕</button>
    <img class="shot" id="detail-shot" alt="" hidden>
    <div class="info">
      <div class="when" id="detail-when"></div>
      <div class="name" id="detail-name"></div>
      <div class="tags" id="detail-tags"></div>
      <div class="row"><span class="k">메뉴</span><span id="detail-menu"></span></div>
    </div>
  </div>
</div>

<div id="roster" class="dlg" role="dialog" aria-modal="true" aria-labelledby="roster-title">
  <div class="box">
    <button class="close" aria-label="닫기">✕</button>
    <div class="head2">
      <h3 id="roster-title">가본 식당</h3>
      <p id="roster-sub"></p>
    </div>
    <div class="list" id="roster-list"></div>
  </div>

  // ── 상세보기 ──
  // 카드에는 툴팁을 달지 않고 이걸 띄운다. 같은 요소에 둘 다 두면 중복이고,
  // 터치 기기에서 hover 툴팁은 아예 동작하지 않는다. 차트 쪽 툴팁은 그대로 둔다.
  function openDetail(p) {
    if (!p) return;
    var d = parse(p.date);
    document.getElementById("detail-when").textContent =
      p.date + " (" + DOW[(d.getDay() + 6) % 7] + ")";
    document.getElementById("detail-name").textContent = p.restaurant;
    document.getElementById("detail-tags").innerHTML =
      '<span class="chip">' + catDot(p.category) + esc(p.category) + "</span>"
      + (p.dong ? '<span class="chip">📍 ' + esc(p.dong) + "</span>" : "");
    document.getElementById("detail-menu").textContent = p.menu || "—";

    var shot = document.getElementById("detail-shot");
    if (p.photo) {
      shot.src = p.photo;                       // 카드 배경으로 이미 받아둔 URL이라 캐시된다
      shot.alt = p.restaurant + " " + (p.menu || "");
      shot.hidden = false;
    } else {
      shot.removeAttribute("src");
      shot.hidden = true;
    }
    openDialog(document.getElementById("detail"));
  }

  // ── 가본 식당 목록 ──
  // 통계의 '자주 간 식당'은 상위 8곳만 보여주므로, 여기서 전체를 볼 수 있게 한다.
  function openRoster() {
    var agg = {};
    POSTS.forEach(function (p) {
      var a = agg[p.restaurant] || (agg[p.restaurant] = { n: 0, last: "", cat: p.category });
      a.n++;
      if (p.date > a.last) { a.last = p.date; a.cat = p.category; }
    });
    var list = Object.keys(agg).map(function (k) {
      return { name: k, n: agg[k].n, last: agg[k].last, cat: agg[k].cat };
    }).sort(function (a, b) { return b.n - a.n || (a.last < b.last ? 1 : -1); });

    document.getElementById("roster-sub").textContent =
      list.length + "곳 · 방문 횟수 많은 순 (두 번 이상 "
      + list.filter(function (r) { return r.n > 1; }).length + "곳)";
    document.getElementById("roster-list").innerHTML = list.map(function (r) {
      return '<div class="item">'
        + '<div class="rn">' + catDot(r.cat) + "<span>" + esc(r.name) + "</span></div>"
        + '<div class="rc">' + r.n + "번</div>"
        + '<div class="rl">' + esc(r.last) + "</div>"
        + "</div>";
    }).join("");
    openDialog(document.getElementById("roster"));
  }
  document.getElementById("kpi-restaurants").addEventListener("click", openRoster);

  // 카드에 data-idx를 심어두고 위임으로 받는다. 매번 리스너를 붙이지 않아도 된다.
  function bindOpeners(root) {
    root.addEventListener("click", function (e) {
      var el = e.target.closest("[data-idx]");
      if (el) openDetail(POSTS[+el.getAttribute("data-idx")]);
    });
    root.addEventListener("keydown", function (e) {
      if (e.key !== "Enter" && e.key !== " ") return;
      var el = e.target.closest && e.target.closest("[data-idx]");
      if (el) { e.preventDefault(); openDetail(POSTS[+el.getAttribute("data-idx")]); }
    });
  }

  // ── 주간 ──
  // 기준일부터 과거로 평일 5일. 위에서부터 오늘과 가까운 순이다.
  function renderWeek() {
    var host = document.getElementById("week-view");
    var days = weekdaysBack(state.anchor, 5);
    var html = "";
    days.forEach(function (d) {
      var key = iso(d);
      var list = byDate[key] || [];
      var p = list[0];
      html += '<div class="day' + (key === TODAY_ISO ? " today" : "") + '">'
        + '<div class="head"><span class="dow">' + DOW[(d.getDay() + 6) % 7] + "</span>"
        + '<span class="dnum">' + (d.getMonth() + 1) + "/" + d.getDate() + "</span></div>";
      if (!p) {
        html += '<div class="empty">기록 없음</div>';
      } else {
        html += '<div class="body openable" data-idx="' + p._i
          + '" tabindex="0" role="button" aria-label="'
          + esc(p.restaurant + " 자세히 보기") + '">';
        if (p.photo) {
          // asset_url(encode=True)이 이미 퍼센트 인코딩한 URL이다. 여기서 또
          // encodeURI를 걸면 '%'가 '%25'로 이중 인코딩돼 404가 난다.
          html += '<div class="shotimg" style="background-image:url(\'' + esc(p.photo) + '\')"></div>';
        }
        html += '<div class="meta">'
          + '<span class="chip">' + catDot(p.category) + esc(p.category) + "</span>"
          + '<div class="rest">' + esc(p.restaurant) + "</div>"
          + (p.menu ? '<div class="menu">' + esc(p.menu) + "</div>" : "")
          + "</div></div>";
      }
      html += "</div>";
    });
    host.innerHTML = html;
    var oldest = days[days.length - 1];
    document.getElementById("range").textContent =
      (oldest.getMonth() + 1) + "/" + oldest.getDate() + " – "
      + (state.anchor.getMonth() + 1) + "/" + state.anchor.getDate();
  }

  // ── 월간 ──
  function renderMonth() {
    var y = state.month.getFullYear(), m = state.month.getMonth();
    var first = new Date(y, m, 1);
    var lead = (first.getDay() + 6) % 7;          // 월요일 시작 보정
    var days = new Date(y, m + 1, 0).getDate();
    var html = "";
    for (var i = 0; i < 7; i++) {
      html += '<div class="dowhead' + (i > 4 ? " wknd" : "") + '">' + DOW[i] + "</div>";
    }
    for (var b = 0; b < lead; b++) html += '<div class="cell blank"></div>';
    for (var day = 1; day <= days; day++) {
      var d = new Date(y, m, day);
      var key = iso(d);
      var list = byDate[key] || [];
      var wknd = d.getDay() === 0 || d.getDay() === 6;
      var cls = "cell" + (wknd ? " wknd" : "") + (key === TODAY_ISO ? " today" : "");
      html += '<div class="' + cls + '">';
      html += '<div class="n">' + day + "</div>";
      list.forEach(function (p) {
        html += '<div class="mini openable" data-idx="' + p._i
          + '" tabindex="0" role="button" aria-label="'
          + esc(p.restaurant + " 자세히 보기") + '">'
          + catDot(p.category) + "<span>" + esc(p.restaurant) + "</span></div>";
        if (p.photo) {
          html += '<div class="thumb openable" data-idx="' + p._i + '" aria-hidden="true"'
            + ' style="background-image:url(\'' + esc(p.photo) + '\')"></div>';
        }
      });
      html += "</div>";
    }
    var cal = document.getElementById("cal");
    cal.innerHTML = html;
    document.getElementById("range").textContent = y + "년 " + (m + 1) + "월";
  }

  // ── 통계 ──
  function scoped() {
    if (state.range === "all") return POSTS;
    var pre = TODAY_ISO.slice(0, 7);
    return POSTS.filter(function (p) { return p.date.slice(0, 7) === pre; });
  }

  function renderStats() {
    var rows = scoped();
    var stack = document.getElementById("stack");
    var legend = document.getElementById("legend");

    if (!rows.length) {
      stack.innerHTML = "";
      legend.innerHTML = '<span class="vl" style="color:var(--ink-3)">이 기간에는 기록이 없습니다.</span>';
      document.getElementById("rank").innerHTML = "";
      document.getElementById("rank-hint").textContent = "";
      return;
    }

    // 카테고리 — 부분과 전체. 색은 고정 순서, 순위와 무관하다.
    var counts = {};
    rows.forEach(function (p) { counts[p.category] = (counts[p.category] || 0) + 1; });
    var cats = CAT_ORDER.filter(function (c) { return counts[c]; });
    var sHtml = "", lHtml = "";
    cats.forEach(function (c) {
      var n = counts[c], pct = Math.round((n / rows.length) * 1000) / 10;
      var t = esc(c + " " + n + "번 · " + pct + "%");
      sHtml += '<div style="flex:' + n + ';background:' + CAT_COLORS[c] + '" data-tip="' + t + '" tabindex="0"></div>';
      lHtml += '<span class="item">' + catDot(c) + '<span class="nm">' + esc(c)
        + '</span><span class="vl">' + n + "번 · " + pct + "%</span></span>";
    });
    stack.innerHTML = sHtml;
    legend.innerHTML = lHtml;
    bindTips(stack);

    // 식당 랭킹 — 길이가 횟수, 색은 카테고리(정체성). 값은 막대 끝에 글자로도 적는다.
    var agg = {};
    rows.forEach(function (p) {
      var a = agg[p.restaurant] || (agg[p.restaurant] = { n: 0, last: "", cat: p.category });
      a.n++;
      if (p.date > a.last) { a.last = p.date; a.cat = p.category; }
    });
    var list = Object.keys(agg).map(function (k) {
      return { name: k, n: agg[k].n, last: agg[k].last, cat: agg[k].cat };
    }).sort(function (a, b) { return b.n - a.n || (a.last < b.last ? 1 : -1); });

    var top = list.slice(0, 8);
    var max = top[0].n;
    document.getElementById("rank").innerHTML = top.map(function (r) {
      var t = esc(r.name + " · " + r.n + "번 · 마지막 " + r.last + " · " + r.cat);
      return '<div class="row">'
        + '<div class="nm" title="' + esc(r.name) + '">' + esc(r.name) + "</div>"
        + '<div class="track"><div class="fill" style="width:' + ((r.n / max) * 100)
        + "%;background:" + (CAT_COLORS[r.cat] || CAT_COLORS["기타"]) + '" data-tip="' + t + '" tabindex="0"></div></div>'
        + '<div class="vl">' + r.n + "번 <span class=\"last\">· " + esc(r.last.slice(5)) + "</span></div>"
        + "</div>";
    }).join("");
    bindTips(document.getElementById("rank"));

    var revisit = list.filter(function (r) { return r.n > 1; }).length;
    document.getElementById("rank-hint").textContent =
      "식당 " + list.length + "곳 중 " + revisit + "곳을 두 번 이상 갔습니다."
      + (list.length > top.length ? " (상위 " + top.length + "곳만 표시)" : "");
  }

  // ── 추천 ──
  // 최근 14일 안에 간 곳은 후보에서 뺀다. 다 최근이면 가장 오래전에 간 곳.
  function renderReco() {
    var nameEl = document.getElementById("reco-name");
    var whyEl = document.getElementById("reco-why");
    if (!POSTS.length) {
      nameEl.textContent = "—";
      whyEl.textContent = "기록이 아직 없습니다.";
      return;
    }
    var lastBy = {};
    POSTS.forEach(function (p) {
      if (!lastBy[p.restaurant] || p.date > lastBy[p.restaurant]) lastBy[p.restaurant] = p.date;
    });
    var cutoff = iso(addDays(TODAY, -14));
    var names = Object.keys(lastBy);
    var fresh = names.filter(function (n) { return lastBy[n] < cutoff; });
    var pick, why;
    if (fresh.length) {
      pick = fresh[Math.floor(Math.random() * fresh.length)];
      why = "최근 2주간 안 간 " + fresh.length + "곳 중에서 골랐습니다 · 마지막 방문 " + lastBy[pick];
    } else {
      pick = names.reduce(function (a, b) { return lastBy[a] <= lastBy[b] ? a : b; });
      why = "다 최근에 갔네요. 그중 가장 오래된 곳입니다 · 마지막 방문 " + lastBy[pick];
    }
    nameEl.textContent = pick;
    whyEl.textContent = why;
  }

  // ── 표 ──
  function renderTable() {
    document.getElementById("tbody").innerHTML = POSTS.map(function (p) {
      return "<tr><td class=\"num\">" + esc(p.date) + "</td><td>" + esc(p.restaurant)
        + "</td><td>" + esc(p.dong) + "</td><td>" + esc(p.category)
        + '</td><td class="wide">' + esc(p.menu) + "</td></tr>";
    }).join("");
  }

  // ── 렌더 / 이벤트 ──
  function paint() {
    var week = state.view === "week";
    document.getElementById("week-view").hidden = !week;
    document.getElementById("month-view").hidden = week;
    document.getElementById("v-week").setAttribute("aria-pressed", String(week));
    document.getElementById("v-month").setAttribute("aria-pressed", String(!week));
    hideTip();
    if (week) renderWeek(); else renderMonth();
  }

  document.getElementById("v-week").onclick = function () { state.view = "week"; paint(); };
  document.getElementById("v-month").onclick = function () { state.view = "month"; paint(); };
  document.getElementById("prev").onclick = function () { step(-1); };
  document.getElementById("next").onclick = function () { step(1); };
  document.getElementById("jump").onclick = function () {
    state.anchor = HOME_ANCHOR;
    state.month = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
    paint();
  };
  function step(dir) {
    if (state.view === "week") {
      // 평일 5칸씩 이동. 앞으로는 기준일(오늘 직전 평일)을 넘지 않게 막는다 —
      // 그 뒤는 아직 오지 않은 날이라 빈 칸만 나온다.
      var next = state.anchor;
      for (var i = 0; i < 5; i++) next = stepWeekday(next, dir);
      if (dir > 0 && next > HOME_ANCHOR) next = HOME_ANCHOR;
      state.anchor = next;
    } else {
      state.month = new Date(state.month.getFullYear(), state.month.getMonth() + dir, 1);
    }
    paint();
  }
  document.addEventListener("keydown", function (e) {
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    // 오버레이가 열려 있으면 Esc로 닫고, 화살표로 뒤쪽 달력이 넘어가지 않게 막는다.
    if (dialogOpen()) {
      if (e.key === "Escape") { e.preventDefault(); closeDialog(); }
      else if (e.key === "ArrowLeft" || e.key === "ArrowRight") e.preventDefault();
      return;
    }
    if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "ArrowRight") step(1);
  });

  function setRange(r) {
    state.range = r;
    document.getElementById("r-all").setAttribute("aria-pressed", String(r === "all"));
    document.getElementById("r-month").setAttribute("aria-pressed", String(r === "month"));
    renderStats();
  }
  document.getElementById("r-all").onclick = function () { setRange("all"); };
  document.getElementById("r-month").onclick = function () { setRange("month"); };
  document.getElementById("reco-again").onclick = renderReco;

  document.getElementById("sub").textContent = POSTS.length
    ? POSTS[POSTS.length - 1].date + " – " + POSTS[0].date + " · 총 " + POSTS.length + "번"
    : "아직 기록이 없습니다.";

  // 카드는 다시 그려지므로 컨테이너에 한 번만 위임해 둔다.
  bindOpeners(document.getElementById("week-view"));
  bindOpeners(document.getElementById("cal"));

  paint();
  renderStats();
  renderReco();
  renderTable();
})();
</script>
</body>
</html>
