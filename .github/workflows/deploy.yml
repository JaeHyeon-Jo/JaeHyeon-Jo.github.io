name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history for git info
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-
      - name: Install Dependencies
        run: npm ci
      - name: Install Quartz plugins
        run: npx quartz plugin install
      - name: Patch Explorer sorting
        run: |
          sed -i 's/return (a.displayName || "").localeCompare/if (a.data \&\& b.data) { const aDate = a.data.dates?.modified ?? a.data.dates?.created ?? new Date(0); const bDate = b.data.dates?.modified ?? b.data.dates?.created ?? new Date(0); if (aDate.getTime() !== bDate.getTime()) { return bDate.getTime() - aDate.getTime(); } } return (a.displayName || "").localeCompare/' .quartz/plugins/explorer/src/components/Explorer.tsx
          cd .quartz/plugins/explorer && npm install && npm run build
      - name: Build Quartz
        run: npx quartz build
      - name: Copy Google Verification
        run: cp content/google5ea0e11a58705da0.html public/ || true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
