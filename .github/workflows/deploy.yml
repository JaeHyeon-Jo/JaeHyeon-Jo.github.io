name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for git info
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Cache Quartz plugins
        uses: actions/cache@v6
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-
      - name: Install Dependencies
        run: npm ci
      - name: Install Quartz plugins
        run: npx quartz plugin install
      - name: Patch Explorer sorting
        run: |
          sed -i 's/return (a.displayName || "").localeCompare/if (a.data \&\& b.data) { const aD = (a.data as any).dates?.modified ?? (a.data as any).dates?.created; const bD = (b.data as any).dates?.modified ?? (b.data as any).dates?.created; const aDate = aD ? new Date(aD) : new Date(0); const bDate = bD ? new Date(bD) : new Date(0); if (aDate.getTime() !== bDate.getTime()) { return bDate.getTime() - aDate.getTime(); } } return (a.displayName || "").localeCompare/' .quartz/plugins/explorer/src/components/Explorer.tsx
          cd .quartz/plugins/explorer && npm install && npm run build
      - name: Build Quartz
        run: npx quartz build
      - name: Copy Google Verification
        run: cp content/google5ea0e11a58705da0.html public/ || true
      - name: Create robots.txt
        run: |
          printf '%s\n' \
            'User-agent: *' \
            'Allow: /' \
            '' \
            'Sitemap: https://jaehyeon-jo.github.io/sitemap.xml' \
            > public/robots.txt
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
